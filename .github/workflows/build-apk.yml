name: Build Boyyah Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Boyyah Arena project
        run: |
          unzip -q Boyyah_Arena_PlayStore_Ready.zip -d boyyah
          cd boyyah
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: boyyah
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boyyah-Arena-APK
          path: boyyah/app/build/outputs/apk/debug/app-debug.apk
