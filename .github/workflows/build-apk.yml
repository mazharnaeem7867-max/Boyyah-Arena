name: Build Boyyah Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Boyyah Arena project
        run: |
          unzip -q Boyyah_Arena_PlayStore_Ready.zip -d boyyah
          cd boyyah
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        working-directory: boyyah
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix JVM targets
        working-directory: boyyah
        run: |
          python3 - <<'PY'
          p = "app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              '    compileSdk = 35\n',
              '''    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          )
          open(p, "w").write(s)
          PY

      - name: Fix Kotlin button calls
        working-directory: boyyah
        run: |
          python3 - <<'PY'
          p = "app/src/main/java/com/boyyaharena/app/MainActivity.kt"
          s = open(p).read()
          s = s.replace(
              'button("NEXT — PAYMENT") { showPayment(name.text.toString(), uid.text.toString()) }',
              'button("NEXT — PAYMENT", { showPayment(name.text.toString(), uid.text.toString()) })'
          )
          s = s.replace(
              'button("SUBMIT REGISTRATION") {\n            booked.add(selectedSlot)\n            showSuccess(name.ifBlank{"Player"}, uid.ifBlank{"—"}, tx.text.toString())\n        }',
              'button("SUBMIT REGISTRATION", {\n            booked.add(selectedSlot)\n            showSuccess(name.ifBlank{"Player"}, uid.ifBlank{"—"}, tx.text.toString())\n        })'
          )
          s = s.replace(
              'button("MY SLOTS") { showMySlots() }',
              'button("MY SLOTS", { showMySlots() })'
          )
          s = s.replace(
              'button("RULES") { showRules() }',
              'button("RULES", { showRules() })'
          )
          s = s.replace(
              'button("ADMIN PANEL (DEMO)") { showAdmin() }',
              'button("ADMIN PANEL (DEMO)", { showAdmin() })'
          )
          open(p, "w").write(s)
          PY

      - name: Build APK
        working-directory: boyyah
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boyyah-Arena-APK
          path: boyyah/app/build/outputs/apk/debug/app-debug.apk
